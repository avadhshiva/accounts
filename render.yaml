# Render blueprint — deploy from repo root (monorepo)
# Dashboard: New → Blueprint → branch cursor/ai-career-coach-mvp-8c82
#
# Free tier: no persistent disk — signups live in data/db.json but may reset on
# redeploy/restart. For pilot: use Google Form feedback (NEXT_PUBLIC_FEEDBACK_FORM_URL).

services:
  - type: web
    name: pathly-pilot
    runtime: node
    rootDir: career-coach
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: AUTH_SECRET
        generateValue: true
      - key: PILOT_MODE
        value: "true"
      - key: TRIAL_MINUTES
        value: "2880"
      - key: ALLOW_MANUAL_UNLOCK
        value: "false"
      - key: ALLOW_TEST_PRO
        value: "false"
      - key: NEXT_PUBLIC_APP_NAME
        value: Pathly
