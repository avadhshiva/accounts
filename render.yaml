# Render blueprint — deploy from repo root (monorepo)
# Dashboard: New → Blueprint → branch cursor/pathly-product-revamp-8c82
#
# REQUIRED: Set DATABASE_URL in Render dashboard (Supabase PostgreSQL connection string).
# Run `npm run db:migrate` once after first deploy (see career-coach/docs/PERSISTENCE.md).

services:
  - type: web
    name: pathly-pilot
    runtime: node
    rootDir: career-coach
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: AUTH_SECRET
        generateValue: true
      - key: PILOT_MODE
        value: "true"
      - key: TRIAL_MINUTES
        value: "10080"
      - key: ALLOW_MANUAL_UNLOCK
        value: "false"
      - key: ALLOW_TEST_PRO
        value: "false"
      - key: NEXT_PUBLIC_APP_NAME
        value: LaunchRole
      # DATABASE_URL — set manually in Render dashboard (Supabase URI). Do not commit.
